[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "multidb"
version = "0.1.0"
description = "Multi-engine database migration runner for CI/CD pipelines"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
multidb = "multidb.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
